<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <script src="https://cdn.tailwind.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['DM Sans', 'sans-serif'],
            mono: ['DM Mono', 'monospace'],
          },
          colors: {
            base: {
              950: '#0f1117',
              900: '#161b27',
              800: '#1e2536',
              700: '#252d40',
              600: '#2e3650',
              500: '#3d4a6b',
              400: '#4d5b7c',
              300: '#8892b0',
              200: '#c2c8da',
              100: '#e8eaf2',
            },
            accent: {
              DEFAULT: '#6c7ef8',
              hover:   '#5468e7',
            },
          },
          keyframes: {
            slideIn: {
              '0%':   { opacity: '0', transform: 'translateY(-6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            popIn: {
              '0%':   { opacity: '0', transform: 'scale(0.95) translateY(-4px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
            },
          },
          animation: {
            slideIn: 'slideIn 0.2s ease',
            popIn:   'popIn 0.15s ease',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="kanban-board.css">
</head>
<body>
  <header>
    <div>
      <div>
        <i aria-hidden="true"></i>
      </div>
      <div>
        <div id="board-name-display">My Workspace</div>
        <div>Kanban Board</div>
      </div>
    </div>

    <div id="board-tabs"></div>

    <div>
      <button><i aria-hidden="true"></i>New Board</button>
      <button><i aria-hidden="true"></i>Add Task</button>
    </div>
  </header>

  <div id="stats-bar"></div>

  <main>
    <div id="board"></div>
  </main>

  <div id="quick-add-modal">
    <div>
      <div>
        <span>Quick add task</span>
        <button><i></i></button>
      </div>
      <div>
        <div>
          <label for="qa-title">Title</label>
          <input id="qa-title" placeholder="What needs to be done?" autocomplete="off">
        </div>
        <div>
          <label>Priority</label>
          <select id="qa-priority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div>
          <label for="qa-due">Due Date</label>
          <input type="date" id="qa-due">
        </div>
        <div>
          <button>Cancel</button>
          <button>Add task</button>
        </div>
      </div>
    </div>
  </div>

  <div id="new-board-modal">
    <div>
      <div>
        <span>New board</span>
        <button><i></i></button>
      </div>
      <div>
        <label for="new-board-name">Board name</label>
        <input id="new-board-name" placeholder="e.g. Q3 Roadmap" autocomplete="off">
        <div>
          <button>Cancel</button>
          <button>Create board</button>
        </div>
      </div>
    </div>
  </div>
  <script src="kanban-board.js"></script>
</body>
</html>
